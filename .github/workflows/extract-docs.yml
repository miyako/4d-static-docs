name: Extract documentation

on:
  workflow_dispatch:
    inputs:
      snapshot_ref:
        description: "This repository's branch or commit containing regenerated mirror/docs"
        required: true
        default: main
      version:
        description: "Version folder; auto selects the highest non-beta version"
        required: true
        default: auto
      release_tag:
        description: "Optional explicit static-docs release tag; overrides snapshot_ref"
        required: false
      release_repository:
        description: "Repository containing the static-docs release"
        required: true
        default: miyako/4d-static-docs
      syntax_json:
        description: "Capture path; snapshot defaults to references/syntaxEN.json; release uses bundled capture"
        required: false
      syntax_version:
        description: "Actual capture version; snapshot defaults to 21-R3; release uses bundled metadata"
        required: false
      syntax_build:
        description: "4D build that supplied the syntax capture (optional)"
        required: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            pipeline
            references
            out/manifest.json
            out/oop_manifest.json
            out/oop_stage1_raw.json
          sparse-checkout-cone-mode: false

      - name: Checkout generated static pages (read-only input)
        if: ${{ !inputs.release_tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.snapshot_ref }}
          path: static-snapshot
          persist-credentials: false
          sparse-checkout: |
            mirror/docs
            references

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install extraction dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Extract review bundle
        env:
          DOCS_VERSION: ${{ inputs.version }}
          SYNTAX_JSON: ${{ inputs.syntax_json }}
          SYNTAX_VERSION: ${{ inputs.syntax_version }}
          SYNTAX_BUILD: ${{ inputs.syntax_build }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--version "$DOCS_VERSION")
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--release-tag "$RELEASE_TAG" --release-repo "$RELEASE_REPOSITORY")
            if [ -n "$SYNTAX_JSON" ]; then
              args+=(--syntax-json "$SYNTAX_JSON")
            fi
          else
            args+=(--docs-tree static-snapshot/mirror/docs)
            args+=(--syntax-json "static-snapshot/${SYNTAX_JSON:-references/syntaxEN.json}")
          fi
          if [ -n "$SYNTAX_VERSION" ]; then
            args+=(--syntax-version "$SYNTAX_VERSION")
          fi
          if [ -n "$SYNTAX_BUILD" ]; then
            args+=(--syntax-build "$SYNTAX_BUILD")
          fi
          python pipeline/extract_review_bundle.py "${args[@]}"

      - name: Add extraction summary
        if: ${{ always() }}
        run: |
          if [ -f extraction/summary.md ]; then
            cat extraction/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review bundle (including diagnostics on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-extraction-${{ github.run_id }}-${{ github.run_attempt }}
          path: extraction/
          if-no-files-found: error
          retention-days: 30
