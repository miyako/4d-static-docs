name: Extract documentation

on:
  workflow_dispatch:
    inputs:
      snapshot_ref:
        description: "This repository's branch or commit containing regenerated mirror/docs"
        required: true
        default: main
      version:
        description: "Version folder; auto selects the highest non-beta version"
        required: true
        default: auto
      syntax_json:
        description: "Syntax capture path in the static snapshot"
        required: true
        default: references/syntaxEN.json
      syntax_version:
        description: "Actual version of that syntax capture (not the requested HTML version)"
        required: true
        default: 21-R3
      syntax_build:
        description: "4D build that supplied the syntax capture (optional)"
        required: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            pipeline
            references
            out/manifest.json
            out/oop_manifest.json
            out/oop_stage1_raw.json
          sparse-checkout-cone-mode: false

      - name: Checkout generated static pages (read-only input)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.snapshot_ref }}
          path: static-snapshot
          persist-credentials: false
          sparse-checkout: |
            mirror/docs
            references

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install extraction dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Extract review bundle
        env:
          DOCS_VERSION: ${{ inputs.version }}
          SYNTAX_JSON: ${{ inputs.syntax_json }}
          SYNTAX_VERSION: ${{ inputs.syntax_version }}
          SYNTAX_BUILD: ${{ inputs.syntax_build }}
        run: |
          python pipeline/extract_review_bundle.py \
            --docs-tree static-snapshot/mirror/docs \
            --version "$DOCS_VERSION" \
            --syntax-json "static-snapshot/$SYNTAX_JSON" \
            --syntax-version "$SYNTAX_VERSION" \
            --syntax-build "$SYNTAX_BUILD"

      - name: Add extraction summary
        if: ${{ always() }}
        run: |
          if [ -f extraction/summary.md ]; then
            cat extraction/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review bundle (including diagnostics on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-extraction-${{ github.run_id }}-${{ github.run_attempt }}
          path: extraction/
          if-no-files-found: error
          retention-days: 30
